[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimall-mcp"
version = "0.2.0"
description = "Read-only multi-platform shopping MCP server for Codex and Hermes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "playwright>=1.45,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
multimall-mcp = "multimall.server:main"

[tool.setuptools.packages.find]
include = ["multimall*"]

[tool.setuptools.package-data]
multimall = ["dom/*.js"]
